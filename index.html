<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#090B14" />
<title>StarBreaker: Unlimited Drill</title>
<!-- GamePix SDK v3：config 必須在 SDK 之前，SDK 必須在遊戲 bundle 之前 -->
<script>window.GamePixConfig = { lifecycle: 'manual' };</script>
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<style>
  #loading {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #090B14; color: #cfe4ff;
    font-family: system-ui, -apple-system, sans-serif;
    transition: opacity .35s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0; font-size: 20px; letter-spacing: .06em; color: #eaf4ff; }
  #loading .bar { width: 168px; height: 4px; border-radius: 2px; background: rgba(120,170,255,.18); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg, #4da3ff, #7ef0ff); animation: slide 1.1s ease-in-out infinite; }
  #loading small { font-size: 12px; color: rgba(160,190,230,.65); }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
</style>
  <script type="module" crossorigin src="./assets/index-7hhxkfer.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-DLwMpr8L.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer"></div>
</div>
<div id="loading">
  <h1>StarBreaker: Unlimited Drill</h1>
  <div class="bar"><i></i></div>
  <small>Loading…</small>
</div>
</body>
</html>
